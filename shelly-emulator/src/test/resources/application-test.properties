# Test Configuration for Shelly Emulator

# Spring Configuration
spring.main.allow-bean-definition-overriding=true

# MQTT Configuration
mqtt.host=localhost
mqtt.port=1883
mqtt.inbound-topic=test/sungather
mqtt.outbound-current-topic=test/energy/total/status/em:0
mqtt.outbound-total-topic=test/energy/total/status/emdata:0

# InfluxDB Configuration (will be overridden by TestContainers)
influx.url=http://localhost:8086
influx.token=test-token
influx.bucket=test-energy
influx.org=test-org

# Logging
logging.level.com.github.n4zroth.sungather.shellyemulator=INFO
logging.level.org.springframework=INFO
logging.level.org.testcontainers=INFO
